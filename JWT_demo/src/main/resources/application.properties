spring.application.name=JWT_demo
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:jwtdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT Secret Key (HMAC-SHA256 signature requiring at least 256 bits / 32 bytes)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
jwt.expiration=86400000
